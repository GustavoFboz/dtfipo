name: Apply temporary tooth selection color fix

on:
  push:
    branches:
      - fix/tooth-selection-persistence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tooth-selection-persistence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Keep unconfigured selection pink
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/NewCaseDialog.tsx')
          s = p.read_text()
          old = '''                    configuredTeeth={configGroup}\n                    assignedTeeth={isView ? assignedTeeth : teeth}\n'''
          new = '''                    configuredTeeth={\n                      isView\n                        ? configGroup\n                        : Array.from(new Set([\n                            ...configGroup,\n                            ...teeth.filter((tooth) => !assignedTeeth.includes(tooth)),\n                          ]))\n                    }\n                    assignedTeeth={assignedTeeth}\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Selection regression tests
        run: bunx vitest run src/lib/tooth-selection.test.ts
      - name: Production build
        run: bun run build
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-temporary-tooth-selection-color-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NewCaseDialog.tsx .github/workflows/apply-temporary-tooth-selection-color-fix.yml
          git commit -m "fix: keep unconfigured tooth selection in temporary color"
          git push origin HEAD:fix/tooth-selection-persistence
