name: DentalFlow Historical 592 ZIP Volumes Offline Verification

on:
  pull_request:
    branches:
      - main
      - saas/stage-03-asaas-checkout
    paths:
      - "scripts/recovery/verify-zip-payloads.py"
      - "scripts/recovery/verify_historic_592_gui.py"
      - "scripts/recovery/test_verify_historic_592.py"
      - ".github/workflows/saas-historic-592-offline.yml"
      - "docs/saas/evidence/historic-592-offline-recheck-20261107.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-historic-gcm-zip-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=42,<50"
      - name: Test synthetic authenticated index, encrypted ZIPs and corruption refusal
        run: python -m unittest discover -s scripts/recovery -p "test_verify_historic_592.py" -v

  windows-offline-592:
    runs-on: windows-latest
    timeout-minutes: 17
    needs: fake-historic-gcm-zip-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cryptography and Windows packager
        run: python -m pip install "cryptography>=42,<50" "pyinstaller>=6.16,<7"
      - name: Verify synthetic encrypted historical ZIPs on Windows
        run: python -m unittest discover -s scripts/recovery -p "test_verify_historic_592.py" -v
      - name: Compile offline verifier with bundled historical ZIP reader
        run: python -m PyInstaller --noconfirm --onefile --windowed --add-data "scripts/recovery/verify-zip-payloads.py;." --name DentalFlow-Conferencia-592-Offline scripts/recovery/verify_historic_592_gui.py
      - name: Upload unsigned executable only, without data, key or archive
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-Conferencia-592-Offline-Windows-unsigned
          path: dist/DentalFlow-Conferencia-592-Offline.exe
          if-no-files-found: error
          retention-days: 7
