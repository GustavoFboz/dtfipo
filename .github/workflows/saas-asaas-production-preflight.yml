name: SaaS Production credentials readonly check

on:
  push:
    branches: ["saas/stage-03-asaas-checkout"]
    paths:
      - "src/lib/billing/asaas-production-preflight.server.ts"
      - "src/routes/api/billing/asaas-worker.ts"
      - ".github/workflows/saas-asaas-production-preflight.yml"
      - "docs/saas/PRODUCTION-ACCESS-SETUP.md"
  workflow_dispatch:

# No schedule: account-registration status is a punctual diagnostic.
permissions:
  contents: read

concurrency:
  group: saas-asaas-production-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BILLING_PRODUCTION_WORKER_TOKEN: ${{ secrets.BILLING_PRODUCTION_WORKER_TOKEN }}
    steps:
      - name: Read staged Production credentials and account status
        if: env.BILLING_PRODUCTION_WORKER_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for attempt in {1..3}; do
            http_status=000
            if http_status=$(printf 'Authorization: Bearer %s\n' "$BILLING_PRODUCTION_WORKER_TOKEN" | \
              curl --silent --show-error --max-time 12 --output "$response_file" --write-out '%{http_code}' \
                --request GET --header @- \
                'https://dtfipo.lovable.app/api/billing/asaas-worker?check=production-setup'); then
              if [[ "$http_status" == "200" ]] && jq -e '
                def stamp: type == "string" and length <= 40 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$");
                def state: . == "APPROVED" or . == "PENDING" or . == "AWAITING_APPROVAL" or . == "REJECTED" or . == "EXPIRED";
                .available == true and .contract == "dentalflow-production-preflight-v2" and .environment == "production"
                and .configuration_valid == true and .credentials_valid == true
                and (.checked_at | stamp)
                and (.account | type == "object")
                and (.account.general | state) and (.account.commercialInfo | state)
                and (.account.bankAccountInfo | state) and (.account.documentation | state)
                and (.account_approved == (.account.general == "APPROVED"))
                and (.account_setup_complete == ([.account.general,.account.commercialInfo,.account.bankAccountInfo,.account.documentation] | all(. == "APPROVED")))
                and (.runtime_environment == "sandbox" or .runtime_environment == "production" or .runtime_environment == null)
                and (.production_enabled | type == "boolean")
                and .webhook_delivery_verified == false and .financial_processing_invoked == false
              ' "$response_file" > /dev/null; then
                jq '{available,contract,environment,checked_at,configuration_valid,credentials_valid,
                  account:{general:.account.general,commercialInfo:.account.commercialInfo,
                    bankAccountInfo:.account.bankAccountInfo,documentation:.account.documentation},
                  account_approved,account_setup_complete,runtime_environment,production_enabled,webhook_delivery_verified,financial_processing_invoked}' \
                  "$response_file" > production-preflight.json
                echo 'Production key authentication confirmed by readonly account-status request.'
                if ! jq -e '.account_approved == true' production-preflight.json > /dev/null; then
                  echo '::error::Production key works, but the general account status is not approved. Inspect sanitized evidence.'
                  exit 1
                fi
                if ! jq -e '.account_setup_complete == true' production-preflight.json > /dev/null; then
                  echo '::notice::General account approval confirmed; an individual registration field still needs review. Inspect sanitized evidence.'
                fi
                echo 'General account approval confirmed. Webhook delivery, financial lifecycle and sales acceptance remain separate gates.'
                exit 0
              fi
              diagnostic_code=$(jq -r '
                if type == "object" then .code else null end
                | if . == "PRODUCTION_CONFIGURATION_FAILED" or . == "PRODUCTION_CREDENTIAL_REFUSED"
                    or . == "PRODUCTION_PROVIDER_UNAVAILABLE" or . == "PRODUCTION_STATUS_INVALID"
                    or . == "PRODUCTION_PREFLIGHT_TIMEOUT" then . else "UNCLASSIFIED" end
              ' "$response_file" 2>/dev/null) || diagnostic_code=UNCLASSIFIED
              provider_status=$(jq -r '
                if type == "object" and (.provider_http_status | type == "number") then .provider_http_status
                  | if . == floor and . >= 100 and . <= 599 then tostring else "NONE" end
                else "NONE" end
              ' "$response_file" 2>/dev/null) || provider_status=NONE
              transport_code=$(jq -r '
                if type == "object" then .transport_code else null end
                | if . == "ENOTFOUND" or . == "EAI_AGAIN" or . == "ECONNRESET" or . == "ECONNREFUSED"
                    or . == "EHOSTUNREACH" or . == "ENETUNREACH" or . == "ETIMEDOUT" or . == "CERT_HAS_EXPIRED"
                    or . == "ERR_TLS_CERT_ALTNAME_INVALID" or . == "UNABLE_TO_VERIFY_LEAF_SIGNATURE"
                    or . == "UND_ERR_CONNECT_TIMEOUT" or . == "UND_ERR_SOCKET" or . == "ERR_SSL_WRONG_VERSION_NUMBER"
                  then . else "NONE" end
              ' "$response_file" 2>/dev/null) || transport_code=NONE
              jq -n --arg http_status "$http_status" --arg code "$diagnostic_code" \
                --arg provider_status "$provider_status" --arg transport_code "$transport_code" \
                '{available:false,http_status:$http_status,code:$code,financial_processing_invoked:false,
                  provider_http_status:(if $provider_status == "NONE" then null else ($provider_status | tonumber) end),
                  transport_code:(if $transport_code == "NONE" then null else $transport_code end)}' \
                > production-preflight.json
              printf 'Production preflight diagnostic: HTTP %s, code %s. Provider HTTP %s, transport %s.\n' \
                "$http_status" "$diagnostic_code" "$provider_status" "$transport_code"
              if [[ "$http_status" == "401" || "$http_status" == "502" ]]; then
                echo "::error::Production preflight refused or provider verification failed (HTTP $http_status). No financial processing was invoked."
                exit 1
              fi
            fi
            echo "Production preflight attempt $attempt did not confirm the published contract (HTTP $http_status)."
            if [[ "$attempt" != "3" ]]; then sleep 5; fi
          done
          echo '::error::Production preflight unavailable. Check publication and backend configuration; no financial processing was invoked.'
          exit 1

      - name: Read staged Production webhook configuration
        if: env.BILLING_PRODUCTION_WORKER_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for attempt in {1..3}; do
            http_status=000
            if http_status=$(printf 'Authorization: Bearer %s\n' "$BILLING_PRODUCTION_WORKER_TOKEN" | \
              curl --silent --show-error --max-time 12 --output "$response_file" --write-out '%{http_code}' \
                --request GET --header @- \
                'https://dtfipo.lovable.app/api/billing/asaas-worker?check=production-webhook'); then
              if [[ "$http_status" == "200" ]] && jq -e '
                def stamp: type == "string" and length <= 40 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$");
                def automated: ["PAYMENT_CONFIRMED","PAYMENT_RECEIVED","PAYMENT_OVERDUE","PAYMENT_REFUNDED","SUBSCRIPTION_CREATED","SUBSCRIPTION_UPDATED","SUBSCRIPTION_INACTIVATED"];
                def review: ["PAYMENT_PARTIALLY_REFUNDED","PAYMENT_REFUND_IN_PROGRESS","PAYMENT_CHARGEBACK_REQUESTED","PAYMENT_CHARGEBACK_DISPUTE","PAYMENT_AWAITING_CHARGEBACK_REVERSAL","SUBSCRIPTION_DELETED"];
                def events($allowed): type == "array" and length <= 13 and length == (unique | length) and all(.[]; . as $event | $allowed | index($event) != null);
                def entry:
                  type == "object"
                  and (.id == null or (.id | type == "string" and length <= 100 and test("^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|whk_[A-Za-z0-9_-]{1,90})$")))
                  and (.enabled | type == "boolean") and (.interrupted | type == "boolean")
                  and (.api_version | type == "number" and . == floor and . >= 1 and . <= 99)
                  and (.send_type == null or .send_type == "SEQUENTIALLY" or .send_type == "NON_SEQUENTIALLY")
                  and (.token_matches == null or (.token_matches | type == "boolean"))
                  and (.configured_events | events(automated + review))
                  and (.missing_automated_events | events(automated)) and (.missing_review_events | events(review))
                  and ((.missing_automated_events | sort) == ((automated - .configured_events) | sort))
                  and ((.missing_review_events | sort) == ((review - .configured_events) | sort))
                  and (.unknown_events_count | type == "number" and . == floor and . >= 0 and . <= 300);
                def configured: .enabled == false and .interrupted == false and .api_version == 3
                  and .send_type == "SEQUENTIALLY"
                  and (.missing_automated_events | length) == 0 and (.missing_review_events | length) == 0 and .unknown_events_count == 0;
                .available == true and .contract == "dentalflow-production-webhook-preflight-v2" and .environment == "production"
                and .configuration_valid == true and .credentials_valid == true and (.checked_at | stamp)
                and (.listing_complete | type == "boolean") and (.webhooks | type == "array" and length <= 100 and all(.[]; entry))
                and (.matching_webhooks == (.webhooks | length))
                and (.webhook_configuration_valid == (.listing_complete and .matching_webhooks == 1 and (.webhooks | all(.[]; configured))))
                and (.token_verification == (if .listing_complete and .matching_webhooks == 1 then
                  (if .webhooks[0].token_matches == true then "confirmed"
                   elif .webhooks[0].token_matches == false then "mismatch" else "requires_delivery" end)
                  else "not_checked" end))
                and (.webhook_prepared == (.webhook_configuration_valid and .token_verification == "confirmed"))
                and .webhook_delivery_verified == false and .financial_processing_invoked == false
              ' "$response_file" > /dev/null; then
                jq '{available,contract,environment,checked_at,configuration_valid,credentials_valid,
                  listing_complete,matching_webhooks,webhook_configuration_valid,token_verification,webhook_prepared,
                  webhooks:[.webhooks[] | {id,enabled,interrupted,api_version,send_type,token_matches,
                    configured_events,missing_automated_events,missing_review_events,unknown_events_count}],
                  webhook_delivery_verified,financial_processing_invoked}' "$response_file" > production-webhook-preflight.json
                echo 'Production webhook configuration read without changing or sending events.'
                if ! jq -e '.webhook_configuration_valid == true' production-webhook-preflight.json > /dev/null; then
                  echo '::error::Production webhook configuration is not confirmed as correct and disabled. Inspect sanitized evidence.'
                  exit 1
                fi
                if jq -e '.token_verification == "mismatch"' production-webhook-preflight.json > /dev/null; then
                  echo '::error::Production webhook token mismatch confirmed. Inspect the protected configuration.'
                  exit 1
                fi
                if jq -e '.token_verification == "requires_delivery"' production-webhook-preflight.json > /dev/null; then
                  echo '::notice::Asaas hides the webhook token after creation. Authentication remains pending real provider delivery; no event was sent.'
                fi
                echo 'Disabled Production webhook configuration confirmed. Authentication, delivery and financial acceptance remain separate gates.'
                exit 0
              fi
              diagnostic_code=$(jq -r '
                if type == "object" then .code else null end
                | if . == "PRODUCTION_CONFIGURATION_FAILED" or . == "PRODUCTION_CREDENTIAL_REFUSED"
                    or . == "PRODUCTION_PROVIDER_UNAVAILABLE" or . == "PRODUCTION_WEBHOOK_STATUS_INVALID"
                    or . == "PRODUCTION_PREFLIGHT_TIMEOUT" then . else "UNCLASSIFIED" end
              ' "$response_file" 2>/dev/null) || diagnostic_code=UNCLASSIFIED
              provider_status=$(jq -r '
                if type == "object" and (.provider_http_status | type == "number") then .provider_http_status
                  | if . == floor and . >= 100 and . <= 599 then tostring else "NONE" end
                else "NONE" end
              ' "$response_file" 2>/dev/null) || provider_status=NONE
              transport_code=$(jq -r '
                if type == "object" then .transport_code else null end
                | if . == "ENOTFOUND" or . == "EAI_AGAIN" or . == "ECONNRESET" or . == "ECONNREFUSED"
                    or . == "EHOSTUNREACH" or . == "ENETUNREACH" or . == "ETIMEDOUT" or . == "CERT_HAS_EXPIRED"
                    or . == "ERR_TLS_CERT_ALTNAME_INVALID" or . == "UNABLE_TO_VERIFY_LEAF_SIGNATURE"
                    or . == "UND_ERR_CONNECT_TIMEOUT" or . == "UND_ERR_SOCKET" or . == "ERR_SSL_WRONG_VERSION_NUMBER"
                  then . else "NONE" end
              ' "$response_file" 2>/dev/null) || transport_code=NONE
              jq -n --arg http_status "$http_status" --arg code "$diagnostic_code" \
                --arg provider_status "$provider_status" --arg transport_code "$transport_code" \
                '{available:false,http_status:$http_status,code:$code,financial_processing_invoked:false,
                  provider_http_status:(if $provider_status == "NONE" then null else ($provider_status | tonumber) end),
                  transport_code:(if $transport_code == "NONE" then null else $transport_code end)}' > production-webhook-preflight.json
              printf 'Production webhook diagnostic: HTTP %s, code %s. Provider HTTP %s, transport %s.\n' \
                "$http_status" "$diagnostic_code" "$provider_status" "$transport_code"
              if [[ "$http_status" == "401" || "$http_status" == "502" ]]; then
                echo "::error::Production webhook configuration could not be verified (HTTP $http_status). No events were sent."
                exit 1
              fi
            fi
            echo "Production webhook preflight attempt $attempt did not confirm the published contract (HTTP $http_status)."
            if [[ "$attempt" != "3" ]]; then sleep 5; fi
          done
          echo '::error::Production webhook preflight unavailable. Check publication and backend configuration.'
          exit 1

      - name: Report unstaged Production credential
        if: env.BILLING_PRODUCTION_WORKER_TOKEN == ''
        run: |
          echo 'Production diagnostic not executed: BILLING_PRODUCTION_WORKER_TOKEN is not staged. This is not Production acceptance.'

      - name: Save sanitized account and webhook configuration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-production-preflight-${{ github.run_id }}
          path: |
            production-preflight.json
            production-webhook-preflight.json
          if-no-files-found: ignore
          retention-days: 30
