name: SaaS Production credentials readonly check

on:
  push:
    branches: ["saas/stage-03-asaas-checkout"]
    paths:
      - "src/lib/billing/asaas-production-preflight.server.ts"
      - "src/routes/api/billing/asaas-worker.ts"
      - ".github/workflows/saas-asaas-production-preflight.yml"
      - "docs/saas/PRODUCTION-ACCESS-SETUP.md"
  workflow_dispatch:

# No schedule: account-registration status is a punctual diagnostic.
permissions:
  contents: read

concurrency:
  group: saas-asaas-production-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BILLING_PRODUCTION_WORKER_TOKEN: ${{ secrets.BILLING_PRODUCTION_WORKER_TOKEN }}
    steps:
      - name: Read staged Production credentials and account status
        if: env.BILLING_PRODUCTION_WORKER_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for attempt in {1..3}; do
            http_status=000
            if http_status=$(printf 'Authorization: Bearer %s\n' "$BILLING_PRODUCTION_WORKER_TOKEN" | \
              curl --silent --show-error --max-time 12 --output "$response_file" --write-out '%{http_code}' \
                --request GET --header @- \
                'https://dtfipo.lovable.app/api/billing/asaas-worker?check=production-setup'); then
              if [[ "$http_status" == "200" ]] && jq -e '
                def stamp: type == "string" and length <= 40 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$");
                def state: . == "APPROVED" or . == "PENDING" or . == "AWAITING_APPROVAL" or . == "REJECTED" or . == "EXPIRED";
                .available == true and .contract == "dentalflow-production-preflight-v1" and .environment == "production"
                and .configuration_valid == true and .credentials_valid == true
                and (.checked_at | stamp)
                and (.account | type == "object")
                and (.account.general | state) and (.account.commercialInfo | state)
                and (.account.bankAccountInfo | state) and (.account.documentation | state)
                and (.account_approved == ([.account[]] | all(. == "APPROVED")))
                and (.runtime_environment == "sandbox" or .runtime_environment == "production" or .runtime_environment == null)
                and (.production_enabled | type == "boolean")
                and .webhook_delivery_verified == false and .financial_processing_invoked == false
              ' "$response_file" > /dev/null; then
                jq '{available,contract,environment,checked_at,configuration_valid,credentials_valid,
                  account:{general:.account.general,commercialInfo:.account.commercialInfo,
                    bankAccountInfo:.account.bankAccountInfo,documentation:.account.documentation},
                  account_approved,runtime_environment,production_enabled,webhook_delivery_verified,financial_processing_invoked}' \
                  "$response_file" > production-preflight.json
                echo 'Production key authentication confirmed by readonly account-status request.'
                if ! jq -e '.account_approved == true' production-preflight.json > /dev/null; then
                  echo '::error::Production key works, but account registration still needs review. Inspect sanitized evidence.'
                  exit 1
                fi
                echo 'Account statuses approved. Webhook delivery, financial lifecycle and sales acceptance remain separate gates.'
                exit 0
              fi
              diagnostic_code=$(jq -r '
                if type == "object" then .code else null end
                | if . == "PRODUCTION_CONFIGURATION_FAILED" or . == "PRODUCTION_CREDENTIAL_REFUSED"
                    or . == "PRODUCTION_PROVIDER_UNAVAILABLE" or . == "PRODUCTION_STATUS_INVALID"
                    or . == "PRODUCTION_PREFLIGHT_TIMEOUT" then . else "UNCLASSIFIED" end
              ' "$response_file" 2>/dev/null) || diagnostic_code=UNCLASSIFIED
              jq -n --arg http_status "$http_status" --arg code "$diagnostic_code" \
                '{available:false,http_status:$http_status,code:$code,financial_processing_invoked:false}' \
                > production-preflight.json
              printf 'Production preflight diagnostic: HTTP %s, code %s.\n' "$http_status" "$diagnostic_code"
              if [[ "$http_status" == "401" || "$http_status" == "502" ]]; then
                echo "::error::Production preflight refused or provider verification failed (HTTP $http_status). No financial processing was invoked."
                exit 1
              fi
            fi
            echo "Production preflight attempt $attempt did not confirm the published contract (HTTP $http_status)."
            if [[ "$attempt" != "3" ]]; then sleep 5; fi
          done
          echo '::error::Production preflight unavailable. Check publication and backend configuration; no financial processing was invoked.'
          exit 1

      - name: Report unstaged Production credential
        if: env.BILLING_PRODUCTION_WORKER_TOKEN == ''
        run: |
          echo 'Production diagnostic not executed: BILLING_PRODUCTION_WORKER_TOKEN is not staged. This is not Production acceptance.'

      - name: Save sanitized account-status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-production-preflight-${{ github.run_id }}
          path: production-preflight.json
          if-no-files-found: ignore
          retention-days: 30
