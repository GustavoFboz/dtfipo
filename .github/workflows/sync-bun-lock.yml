name: DentalFlow Lockfile Sync

on:
  push:
    branches:
      - "release/0.6.5-mobile-0.2.0"
    paths:
      - "package.json"
      - ".github/workflows/sync-bun-lock.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.5-mobile-0.2.0
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refresh Bun lockfile
        run: bun install
      - name: Commit lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "DentalFlow Build"
          git config user.email "actions@users.noreply.github.com"
          git add bun.lock
          git commit -m "build: sync Bun lockfile for native clients"
          git push origin HEAD:release/0.6.5-mobile-0.2.0
