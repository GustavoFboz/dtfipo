name: Apply tooth selection visual fix

on:
  push:
    branches: ["fix/tooth-selection-persistence"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tooth-selection-persistence
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Keep selected teeth visibly selected in create/edit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/NewCaseDialog.tsx')
          s = p.read_text()
          old = 'assignedTeeth={assignedTeeth}'
          new = 'assignedTeeth={isView ? assignedTeeth : teeth}'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 assignedTeeth binding, found {count}')
          p.write_text(s.replace(old, new))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Selection regression tests
        run: bunx vitest run src/lib/tooth-selection.test.ts
      - name: Production build
        run: bun run build
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-tooth-selection-visual-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NewCaseDialog.tsx .github/workflows/apply-tooth-selection-visual-fix.yml
          git commit -m "fix: persist tooth selection visually across ctrl and shift"
          git push origin HEAD:fix/tooth-selection-persistence
