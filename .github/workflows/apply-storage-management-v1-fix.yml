name: Apply storage management v1 fix

on:
  push:
    branches: [feature/storage-management-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-management-v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch integration points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          def must_regex(path, pattern, repl):
              p = Path(path); s = p.read_text()
              out, n = re.subn(pattern, repl, s, count=1, flags=re.S)
              if n != 1: raise SystemExit(f'missing regex in {path}: {pattern}')
              p.write_text(out)

          # Plain click: one temporary tooth only; Ctrl/Cmd/Shift keep multi-select semantics.
          must_regex(
              'src/components/NewCaseDialog.tsx',
              r'    // Plain click defines a new range anchor and focuses that tooth for work\n    // configuration\. Existing configured teeth remain part of the case\.\n    selectionAnchorRef\.current = tooth;\n    if \(!current\.has\(tooth\)\) \{.*?\n    setConfigGroup\(\[tooth\]\);',
              '''    // Plain click keeps only one temporary selection. Teeth already configured
              // remain part of the case; Ctrl/Cmd and Shift are the explicit multi-select modes.
              selectionAnchorRef.current = tooth;
              const staleTemporary = justAddedTeeth.filter((item) => item !== tooth && !toothHasConfig(item));
              const staleSet = new Set(staleTemporary);
              const next = teeth.filter((item) => !staleSet.has(item));
              if (!next.includes(tooth)) next.push(tooth);
              setTeeth(sortTeeth(next));
              setJustAddedTeeth(toothHasConfig(tooth) ? [] : [tooth]);
              setFocusedTooth(tooth);
              setConfigGroup([tooth]);'''
          )

          # Sidebar storage card, visible only to CEO/Admin/default-admin.
          must_replace('src/components/AppShell.tsx', 'import { DialogAutoReopen } from "./DialogAutoReopen";\n', 'import { DialogAutoReopen } from "./DialogAutoReopen";\nimport { StorageSidebarCard } from "./StorageSidebarCard";\n')
          must_replace('src/components/AppShell.tsx', '  if (pathname.startsWith("/configuracoes")) return "Configurações";\n', '  if (pathname.startsWith("/configuracoes")) return "Configurações";\n  if (pathname.startsWith("/armazenamento")) return "Armazenamento";\n')
          must_replace('src/components/AppShell.tsx', '  const isAdmin = shellEffectiveRole === "CEO" || shellEffectiveRole === "DR";\n', '  const isAdmin = shellEffectiveRole === "CEO" || shellEffectiveRole === "DR";\n  const canManageStorage = !!profile?.is_default_admin || shellEffectiveRole === "CEO" || shellEffectiveRole === "ADMIN";\n')
          must_replace('src/components/AppShell.tsx', '          </nav>\n\n          <div className="mt-auto border-t border-slate-100 dark:border-white/5 bg-white dark:bg-black overflow-hidden flex flex-col">', '          </nav>\n\n          {canManageStorage && <StorageSidebarCard collapsed={isCollapsed} />}\n\n          <div className="mt-auto border-t border-slate-100 dark:border-white/5 bg-white dark:bg-black overflow-hidden flex flex-col">')

          # Attachments: permanent retention, and delete must never submit the parent case form.
          p = Path('src/components/CaseAttachments.tsx'); s = p.read_text()
          s = s.replace('    const expiresIso = new Date(Date.now() + 7 * 24 * 3_600_000).toISOString();\n', '')
          s = s.replace('      expires_at: expiresIso,\n', '      expires_at: null,\n')
          s, n1 = re.subn(r'\s*const tl = timeLeft\(a\.expires_at\);\n\s*const isGone = !!a\.expired_at \|\| tl\.expired;', '\n          const isGone = !!a.expired_at;', s, count=1)
          if n1 != 1: raise SystemExit('attachment expiry status block not found')
          s = s.replace('expira em {tl.label}', 'armazenamento permanente')
          s = s.replace('className={`inline-flex items-center gap-1 ${tl.warn ? "text-amber-500" : "text-muted-foreground"}`}', 'className="inline-flex items-center gap-1 text-muted-foreground"')
          s = s.replace('<AlertCircle className="h-3 w-3" /> expirado', '<AlertCircle className="h-3 w-3" /> indisponível')
          old_delete = '''          <Button size="sm" variant="ghost" className="text-destructive hover:text-destructive"
                    disabled={remove.isPending}
                    onClick={async () => { if (await confirm({ title: "Excluir arquivo", description: `Excluir "${a.file_name}"?`, confirmText: "Excluir", destructive: true })) remove.mutate(a); }}>'''
          new_delete = '''          <Button type="button" size="sm" variant="ghost" className="text-destructive hover:text-destructive"
                    disabled={remove.isPending}
                    onClick={async (event) => {
                      event.preventDefault();
                      event.stopPropagation();
                      if (await confirm({ title: "Excluir arquivo", description: `Excluir "${a.file_name}"?`, confirmText: "Excluir", destructive: true })) {
                        await remove.mutateAsync(a);
                      }
                    }}>'''
          if old_delete not in s: raise SystemExit('attachment delete button not found')
          p.write_text(s.replace(old_delete, new_delete, 1))

          # Quota-aware uploads and managed deletion.
          must_replace('src/lib/api.ts', 'import { broadcastEntity, markDeleted } from "./optimistic";\n', 'import { broadcastEntity, markDeleted } from "./optimistic";\nimport { applyOptimisticStorageDelta, cancelStorageUpload, completeStorageUpload, reserveStorageUpload } from "./storage";\n')
          must_replace('src/lib/api.ts', '  expires_at: string;\n', '  expires_at: string | null;\n')

          must_regex('src/lib/api.ts', r'export async function uploadPatientPhoto\(patientId: string, file: Blob\): Promise<string> \{.*?\n\}\n\nexport async function uploadUserAvatar', '''export async function uploadPatientPhoto(patientId: string, file: Blob): Promise<string> {
            const path = `${patientId}/${Date.now()}.jpg`;
            const reservation = await reserveStorageUpload({ sizeBytes: file.size, bucket: "patient-photos", objectPath: path, sourceType: "patient_photo", patientId, originalName: "Foto do paciente.jpg", mimeType: "image/jpeg" });
            const { error } = await supabase.storage.from("patient-photos").upload(path, file, { contentType: "image/jpeg", upsert: true });
            if (error) { await cancelStorageUpload(reservation.reservationId, file.size); throw error; }
            const { data, error: signErr } = await supabase.storage.from("patient-photos").createSignedUrl(path, 60 * 60 * 24 * 365 * 10);
            if (signErr) { await supabase.storage.from("patient-photos").remove([path]); await cancelStorageUpload(reservation.reservationId, file.size); throw signErr; }
            await completeStorageUpload(reservation.reservationId, patientId);
            return data.signedUrl;
          }

          export async function uploadUserAvatar''')

          must_regex('src/lib/api.ts', r'export async function uploadUserAvatar\(file: Blob\): Promise<string> \{.*?\n\}\n\n// Generic admin CRUD', '''export async function uploadUserAvatar(file: Blob): Promise<string> {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) throw new Error("Não autenticado");
            const path = `${user.id}/${Date.now()}.jpg`;
            const reservation = await reserveStorageUpload({ sizeBytes: file.size, bucket: "avatars", objectPath: path, sourceType: "user_avatar", originalName: "Avatar.jpg", mimeType: "image/jpeg" });
            const { error } = await supabase.storage.from("avatars").upload(path, file, { contentType: "image/jpeg", upsert: true });
            if (error) { await cancelStorageUpload(reservation.reservationId, file.size); throw error; }
            const { data, error: signErr } = await supabase.storage.from("avatars").createSignedUrl(path, 60 * 60 * 24 * 365 * 10);
            if (signErr) { await supabase.storage.from("avatars").remove([path]); await cancelStorageUpload(reservation.reservationId, file.size); throw signErr; }
            const url = data.signedUrl;
            const { error: updErr } = await supabase.from("profiles").update({ avatar_url: url } as never).eq("id", user.id);
            if (updErr) { await supabase.storage.from("avatars").remove([path]); await cancelStorageUpload(reservation.reservationId, file.size); throw updErr; }
            await completeStorageUpload(reservation.reservationId, user.id);
            return url;
          }

          // Generic admin CRUD''')

          must_regex('src/lib/api.ts', r'export async function uploadPatientAttachment\(.*?\n\}\n\nexport async function deletePatientAttachment\(att: PatientAttachment\) \{.*?\n\}\n\nexport async function refreshAttachmentSignedUrl', '''export async function uploadPatientAttachment(
            patientId: string,
            file: File,
            meta: { title: string; description?: string | null; kind?: string },
          ): Promise<PatientAttachment> {
            const ext = file.name.split(".").pop() ?? "bin";
            const path = `${patientId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const reservation = await reserveStorageUpload({ sizeBytes: file.size, bucket: "patient-files", objectPath: path, sourceType: "patient_attachment", patientId, originalName: file.name || meta.title || "arquivo", mimeType: file.type || null });
            const { error: upErr } = await supabase.storage.from("patient-files").upload(path, file, { contentType: file.type || undefined, upsert: false });
            if (upErr) { await cancelStorageUpload(reservation.reservationId, file.size); throw upErr; }
            const { data: signed } = await supabase.storage.from("patient-files").createSignedUrl(path, 60 * 60 * 24 * 365);
            const file_url = signed?.signedUrl ?? "";
            const isImage = (file.type || "").startsWith("image/");
            const { data, error } = await supabase.from("patient_attachments" as never).insert({ patient_id: patientId, title: meta.title, description: meta.description ?? null, kind: meta.kind ?? "other", file_url, file_path: path, thumbnail_url: isImage ? file_url : null, mime_type: file.type || null, size_bytes: file.size } as never).select().single();
            if (error) { await supabase.storage.from("patient-files").remove([path]); await cancelStorageUpload(reservation.reservationId, file.size); throw error; }
            await completeStorageUpload(reservation.reservationId, (data as any).id);
            return data as unknown as PatientAttachment;
          }

          export async function deletePatientAttachment(att: PatientAttachment) {
            markDeleted(att.id);
            applyOptimisticStorageDelta(-Math.max(0, Number(att.size_bytes || 0)));
            const { error: storageError } = await supabase.storage.from("patient-files").remove([att.file_path]);
            if (storageError) console.warn("patient attachment storage cleanup failed", storageError);
            const { error } = await supabase.from("patient_attachments" as never).delete().eq("id", att.id);
            if (error) { applyOptimisticStorageDelta(Math.max(0, Number(att.size_bytes || 0))); throw error; }
          }

          export async function refreshAttachmentSignedUrl''')

          must_regex('src/lib/api.ts', r'export async function uploadCaseAttachment\(.*?\n\}\n\nexport async function fetchCaseAttachmentText', '''export async function uploadCaseAttachment(
            caseId: string,
            file: File,
            notes?: string,
            kind: CaseAttachmentKind = "other",
          ): Promise<CaseAttachment> {
            const ext = file.name.split(".").pop() ?? "bin";
            const path = `${caseId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const reservation = await reserveStorageUpload({ sizeBytes: file.size, bucket: "case-files", objectPath: path, sourceType: "case_attachment", caseId, originalName: file.name, mimeType: file.type || null });
            const { error: upErr } = await supabase.storage.from("case-files").upload(path, file, { contentType: file.type || undefined, upsert: false });
            if (upErr) { await cancelStorageUpload(reservation.reservationId, file.size); throw upErr; }
            const { data: userRes } = await supabase.auth.getUser();
            const { data, error } = await supabase.from("case_attachments" as never).insert({ case_id: caseId, file_name: file.name, storage_path: path, size_bytes: file.size, mime_type: file.type || null, uploaded_by: userRes.user?.id ?? null, notes: notes ?? null, kind } as never).select().single();
            if (error) { await supabase.storage.from("case-files").remove([path]); await cancelStorageUpload(reservation.reservationId, file.size); throw error; }
            await completeStorageUpload(reservation.reservationId, (data as any).id);
            return data as unknown as CaseAttachment;
          }

          export async function fetchCaseAttachmentText''')

          must_regex('src/lib/api.ts', r'export async function deleteCaseAttachment\(att: CaseAttachment\) \{.*?\n\}\n\n// ===== Ad-hoc component', '''export async function deleteCaseAttachment(att: CaseAttachment) {
            const managed = await supabase.rpc("delete_case_attachment_managed" as never, { _attachment_id: att.id } as never);
            const missingRpc = managed.error && (managed.error.code === "PGRST202" || managed.error.code === "42883" || String(managed.error.message || "").toLowerCase().includes("schema cache"));
            if (managed.error && !missingRpc) throw managed.error;
            if (missingRpc) {
              const { error } = await supabase.from("case_attachments" as never).delete().eq("id", att.id);
              if (error) throw error;
            }
            applyOptimisticStorageDelta(-Math.max(0, Number(att.size_bytes || 0)));
            try {
              const { error: storageError } = await supabase.storage.from("case-files").remove([att.storage_path]);
              if (storageError) console.warn("attachment storage cleanup failed", storageError);
            } catch (storageError) { console.warn("attachment storage cleanup failed", storageError); }
            try { markDeleted(att.id); } catch {}
          }

          // ===== Ad-hoc component''')
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bunx vitest run src/lib/tooth-selection.test.ts
      - name: Production build
        run: bun run build
      - name: Commit integration and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-storage-management-v1.yml .github/workflows/apply-storage-management-v1-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate clinic storage management" || exit 0
          git push origin HEAD:feature/storage-management-v1
