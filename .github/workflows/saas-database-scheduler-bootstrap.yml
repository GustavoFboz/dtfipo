name: SaaS Sandbox database scheduler bootstrap

on:
  push:
    branches: ["saas/stage-03-asaas-checkout"]
    paths:
      - "src/lib/billing/asaas-database-scheduler.server.ts"
      - "supabase/migrations/20261005190000_saas_database_scheduler_stage09.sql"
      - ".github/workflows/saas-database-scheduler-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: saas-database-scheduler-bootstrap
  cancel-in-progress: false

jobs:
  configure-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BILLING_PRODUCTION_WORKER_TOKEN: ${{ secrets.BILLING_PRODUCTION_WORKER_TOKEN }}
    steps:
      - name: Require private operator credential
        if: env.BILLING_PRODUCTION_WORKER_TOKEN == ''
        run: |
          echo '::error::Private operator credential missing; no database scheduler was configured.'
          exit 1

      - name: Confirm private contract before configuring the Sandbox schedule
        if: env.BILLING_PRODUCTION_WORKER_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          confirmed=0
          for attempt in {1..3}; do
            if http_status=$(printf 'Authorization: Bearer %s\n' "$BILLING_PRODUCTION_WORKER_TOKEN" | \
              curl --silent --show-error --max-time 12 --output "$response_file" --write-out '%{http_code}' \
                --request GET --header @- \
                'https://dtfipo.lovable.app/api/billing/asaas-worker?check=database-scheduler'); then
              if [[ "$http_status" == "200" ]] && jq -e '
                def stamp: type == "string" and length <= 40 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$");
                .available == true and .contract == "dentalflow-database-scheduler-v1" and .environment == "sandbox"
                and (.checked_at | stamp) and .immediate_worker_invoked == false
                and (.scheduler == null or (.scheduler |
                  .provider_environment == "sandbox" and (.enabled | type == "boolean")
                  and (.cron_active | type == "boolean") and (.cron_job_id | type == "number" and . > 0 and . == floor)
                  and (.schedule == null or .schedule == "1-59/5 * * * *")
                  and (.configured_at | stamp) and (.last_dispatched_at == null or (.last_dispatched_at | stamp))
                  and (.last_response_http_status == null or (.last_response_http_status | type == "number" and . == floor and . >= 100 and . <= 599))
                  and (.last_response_timed_out == null or (.last_response_timed_out | type == "boolean"))))
              ' "$response_file" > /dev/null; then
                jq '{available,contract,environment,checked_at,immediate_worker_invoked,
                  scheduler:(if .scheduler == null then null else (.scheduler | {provider_environment,enabled,cron_job_id,
                    cron_active,schedule,configured_at,last_dispatched_at,last_response_http_status,last_response_timed_out}) end)}' \
                  "$response_file" > database-scheduler.json
                confirmed=1
                break
              fi
            fi
            if [[ "$attempt" != "3" ]]; then sleep 5; fi
          done
          if [[ "$confirmed" != "1" ]]; then
            echo '::error::Sandbox database scheduler contract unavailable. No configuration POST was sent.'
            exit 1
          fi
          if jq -e '.scheduler != null and .scheduler.enabled == true and .scheduler.cron_active == true
            and .scheduler.schedule == "1-59/5 * * * *"
            and .scheduler.last_response_http_status != 401 and .scheduler.last_response_http_status != 403' database-scheduler.json > /dev/null; then
            echo 'Sandbox database schedule already active; preserved its stored credential.'
            exit 0
          fi
          http_status=$(printf 'Authorization: Bearer %s\nContent-Type: application/json\n' "$BILLING_PRODUCTION_WORKER_TOKEN" | \
            curl --silent --show-error --max-time 12 --output "$response_file" --write-out '%{http_code}' \
              --request POST --header @- --data '{"expected_environment":"sandbox"}' \
              'https://dtfipo.lovable.app/api/billing/asaas-worker?check=database-scheduler')
          if [[ "$http_status" != "200" ]] || ! jq -e '
            def stamp: type == "string" and length <= 40 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$");
            .available == true and .contract == "dentalflow-database-scheduler-v1" and .environment == "sandbox"
            and (.checked_at | stamp) and .immediate_worker_invoked == false
            and .scheduler.provider_environment == "sandbox" and .scheduler.scheduled == true
            and .scheduler.schedule == "1-59/5 * * * *" and (.scheduler.cron_job_id | type == "number" and . > 0 and . == floor)
          ' "$response_file" > /dev/null; then
            echo "::error::Sandbox database registration was not confirmed (HTTP $http_status). No immediate worker invocation was requested."
            exit 1
          fi
          jq '{available,contract,environment,checked_at,immediate_worker_invoked,
            scheduler:(.scheduler | {provider_environment,scheduled,cron_job_id,schedule})}' "$response_file" > database-scheduler.json
          echo 'Sandbox cadence registered in Postgres. Actual dispatch, worker execution and regularity still require evidence.'

      - name: Save safe database scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-database-scheduler-${{ github.run_id }}
          path: database-scheduler.json
          if-no-files-found: ignore
          retention-days: 30
