name: DentalFlow Android Mobile
# Capacitor-only mobile release; Tauri remains exclusive to the Windows desktop client.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "mobile/android-*"
      - "release/**"
    paths:
      - "src/**"
      - "mobile/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"
      - "scripts/prepare-notification-sound.mjs"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK 0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Verify Capacitor metadata
        shell: bash
        run: |
          grep -q "br.com.dentalflow.mobile" capacitor.config.ts
          grep -q "appName: 'DentalFlow'" capacitor.config.ts

      - name: Build DentalFlow mobile SPA
        run: bun run build:mobile

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          rm -rf android
          bunx cap add android
          mkdir -p android/app/src/main/java/br/com/dentalflow/mobile
          cp mobile/android/native/DentalFlowPrintPlugin.java android/app/src/main/java/br/com/dentalflow/mobile/DentalFlowPrintPlugin.java
          cp mobile/android/native/MainActivity.java android/app/src/main/java/br/com/dentalflow/mobile/MainActivity.java
          bunx cap sync android
          mkdir -p android/app/src/main/res/raw
          cp mobile/generated/dentalflow_notification.mp3 android/app/src/main/res/raw/dentalflow_notification.mp3
          test -s android/app/src/main/res/raw/dentalflow_notification.mp3

      - name: Set Android app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          p = next((x for x in candidates if x.exists()), None)
          if not p:
              raise SystemExit('Android app Gradle file not found')
          s = p.read_text()
          import re
          s = re.sub(r'versionCode\s+\d+', 'versionCode 2', s)
          s = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "0.2.0"', s)
          p.write_text(s)
          print(p)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" DentalFlow_Android_0.2.0.apk
          sha256sum DentalFlow_Android_0.2.0.apk | tee DentalFlow_Android_0.2.0.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-Android-0.2.0
          path: |
            DentalFlow_Android_0.2.0.apk
            DentalFlow_Android_0.2.0.sha256
          if-no-files-found: error
          retention-days: 14
