name: DentalFlow Android Mobile
# Capacitor-only mobile release; Tauri remains exclusive to the Windows desktop client.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "mobile/android-*"
      - "release/**"
    paths:
      - "src/**"
      - "mobile/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"
      - "scripts/prepare-notification-sound.mjs"
      - "scripts/smoke-test-android.sh"
      - "scripts/test-android-webview.mjs"
      - "scripts/prepare-android-release.py"
      - "scripts/test-android-recovery.sh"
      - "scripts/test-android-release.py"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK 0.2.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "35"
            target: default
            experimental: false
          - api: "37.0"
            target: google_apis
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    env:
      CI: "true"
      DENTALFLOW_ANDROID_PARALLEL: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Capacitor metadata
        shell: bash
        run: |
          grep -q "br.com.dentalflow.mobile" capacitor.config.ts
          grep -q "appName: 'DentalFlow'" capacitor.config.ts

      - name: Build DentalFlow mobile SPA
        run: bun run build:mobile

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          rm -rf android
          bunx cap add android
          mkdir -p android/app/src/main/java/br/com/dentalflow/mobile
          cp mobile/android/native/*.java android/app/src/main/java/br/com/dentalflow/mobile/
          bunx cap sync android
          mkdir -p android/app/src/main/res/raw
          cp mobile/generated/dentalflow_notification.mp3 android/app/src/main/res/raw/dentalflow_notification.mp3
          test -s android/app/src/main/res/raw/dentalflow_notification.mp3

      - name: Set Android app version
        run: python scripts/prepare-android-release.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Enable emulator hardware acceleration
        run: |
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Smoke-test installed Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -partition-size 6144
          # The emulator action evaluates each inline line in a separate `sh -c`.
          # Keep stateful variables and checks in one versioned POSIX script.
          script: sh scripts/smoke-test-android.sh

      - name: Preserve Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-Android-startup-diagnostics-API-${{ matrix.api }}
          path: |
            android-*.log
            android-startup.png
            android-recovery.xml
            android-release-ui.xml
            android-renderer-recovery.xml
            android-native-exit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare APK
        if: matrix.api == 35
        shell: bash
        run: |
          set -euo pipefail
          APK="android-release-candidate.apk"
          test -f "$APK"
          cp "$APK" DentalFlow_Android_0.2.1.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          sha256sum DentalFlow_Android_0.2.1.apk | tee DentalFlow_Android_0.2.1.sha256

      - name: Upload Android APK
        if: matrix.api == 35
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-Android-0.2.1
          path: |
            DentalFlow_Android_0.2.1.apk
            DentalFlow_Android_0.2.1.sha256
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
