name: Apply case detail workflow visual repair

on:
  push:
    branches: [fix/case-detail-workflow-visual]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/case-detail-workflow-visual
      - name: Patch case detail dialog
        shell: bash
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit patched dialog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CaseDetailDialog.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore case detail information and arch view"
          git push origin HEAD:fix/case-detail-workflow-visual
