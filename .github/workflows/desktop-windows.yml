name: DentalFlow Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/desktop-tauri-foundation
      - "fix/**"
      - "release/**"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/icon-512.png"
      - "package.json"
      - "bun.lock"
      - "vite.desktop.config.ts"
      - "scripts/prepare-notification-sound.mjs"
      - "docs/releases/**"
      - "scripts/publish-native-release.mjs"
      - "scripts/test-native-release-publication.mjs"
      - "mobile/audio/exact/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - main
      - "saas/stage-03-asaas-checkout"
      - feature/desktop-tauri-foundation
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/icon-512.png"
      - "package.json"
      - "bun.lock"
      - "vite.desktop.config.ts"
      - "docs/releases/**"
      - "scripts/publish-native-release.mjs"
      - "scripts/test-native-release-publication.mjs"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: dentalflow-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify safe native publication
        run: node scripts/test-native-release-publication.mjs

      - name: Verify atomic offline cache and outbox expiration
        run: |
          node scripts/prepare-notification-sound.mjs
          cargo test --manifest-path src-tauri/Cargo.toml offline_expiration_tests

      - name: Verify release metadata 0.6.8
        shell: pwsh
        run: |
          $tauriConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $version = [string]$tauriConfig.version
          if ($version -ne '0.6.8') { throw "Tauri release must be 0.6.8: $version" }
          $escaped = [regex]::Escape($version)
          if ($cargo -notmatch "(?m)^version\s*=\s*`"$escaped`"") { throw "Rust package version does not match Tauri $version" }
          Write-Host "DentalFlow Desktop release: $version"

      - name: Prepare trusted Windows code signing
        id: codesign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/native-20261017')) && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/native-20261017')) && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host "Trusted code-signing secrets are not configured; build will remain unsigned."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          $base64 = ($env:WINDOWS_CERTIFICATE -replace '-----BEGIN [^-]+-----','' -replace '-----END [^-]+-----','' -replace '\s','')
          [IO.File]::WriteAllBytes("certificate/dentalflow-code-signing.pfx", [Convert]::FromBase64String($base64))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath "certificate/dentalflow-code-signing.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) { throw "Windows code-signing certificate could not be imported." }

          $platformConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "src-tauri/tauri.windows.conf.json" -Value $platformConfig -Encoding UTF8
          "ready=true" >> $env:GITHUB_OUTPUT
          Write-Host "Trusted signing enabled for publisher certificate $($cert.Subject)."

      - name: Build DentalFlow Desktop
        run: bun run desktop:build

      - name: Verify embedded frontend
        shell: pwsh
        run: |
          if (!(Test-Path "dist/client/index.html")) {
            throw "Desktop SPA shell was not generated at dist/client/index.html"
          }

      - name: Verify Windows executable and installer
        shell: pwsh
        run: |
          $app = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -First 1
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $app) { throw "DentalFlow Windows executable was not generated" }
          if (-not $installer) { throw "DentalFlow NSIS installer was not generated" }
          Write-Host "Executable: $($app.FullName)"
          Write-Host "Installer: $($installer.FullName)"

      - name: Prepare permanent Windows release
        id: release
        shell: pwsh
        run: |
          $version = [string]((Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version)
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "DentalFlow NSIS installer was not generated" }
          $releaseName = "DentalFlow_Windows_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $releaseName -Force
          $hash = (Get-FileHash $releaseName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $releaseName" | Set-Content "DentalFlow_Windows_${version}_x64-setup.sha256" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version" >> $env:GITHUB_OUTPUT
          "installer=$releaseName" >> $env:GITHUB_OUTPUT
          "checksum=DentalFlow_Windows_${version}_x64-setup.sha256" >> $env:GITHUB_OUTPUT

      - name: Verify Authenticode signature
        if: steps.codesign.outputs.ready == 'true'
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "src-tauri/target/release" -Filter "*.exe" -File
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          )
          if ($files.Count -lt 2) { throw "Expected application and NSIS installer for signature verification." }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) | $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($file.FullName)" }
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-Windows-0.6.8
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.release.outputs.installer }}
            ${{ steps.release.outputs.checksum }}

  publish-windows-release:
    concurrency:
      group: dentalflow-publish-windows
      cancel-in-progress: false
    name: Publish permanent Windows installer
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/native-20261017')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: DentalFlow-Windows-0.6.8
          path: release

      - name: Publish permanent Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-native-release.mjs windows
