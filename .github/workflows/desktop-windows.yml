name: DentalFlow Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/desktop-tauri-foundation
      - "fix/**"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/icon-512.png"
      - "package.json"
      - "bun.lock"
      - "vite.desktop.config.ts"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - main
      - feature/desktop-tauri-foundation
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/icon-512.png"
      - "package.json"
      - "bun.lock"
      - "vite.desktop.config.ts"
      - ".github/workflows/desktop-windows.yml"

concurrency:
  group: dentalflow-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release metadata 0.3.5
        shell: pwsh
        run: |
          $tauri = Get-Content "src-tauri/tauri.conf.json" -Raw
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          if ($tauri -notmatch '"version"\s*:\s*"0\.3\.5"') { throw "Tauri release is not 0.3.5" }
          if ($cargo -notmatch 'version\s*=\s*"0\.3\.5"') { throw "Rust package release is not 0.3.5" }

      - name: Generate branded NSIS artwork
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "src-tauri/windows" | Out-Null
          $brand = [System.Drawing.ColorTranslator]::FromHtml("#2D7FF9")
          $brandDark = [System.Drawing.ColorTranslator]::FromHtml("#1559C7")
          $surface = [System.Drawing.ColorTranslator]::FromHtml("#F6FAFF")
          $ink = [System.Drawing.ColorTranslator]::FromHtml("#183153")
          $logo = [System.Drawing.Image]::FromFile((Resolve-Path "public/icon-512.png"))

          function Save-Sidebar {
            $bmp = New-Object System.Drawing.Bitmap 164,314
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $rect = New-Object System.Drawing.Rectangle 0,0,164,314
            $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect,$brand,$brandDark,90)
            $g.FillRectangle($brush,$rect)
            $g.DrawImage($logo,42,38,80,80)
            $title = New-Object System.Drawing.Font("Segoe UI",20,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
            $sub = New-Object System.Drawing.Font("Segoe UI",10,[System.Drawing.FontStyle]::Regular,[System.Drawing.GraphicsUnit]::Pixel)
            $white = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
            $soft = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(220,255,255,255))
            $format = New-Object System.Drawing.StringFormat
            $format.Alignment = [System.Drawing.StringAlignment]::Center
            $g.DrawString("DentalFlow",$title,$white,(New-Object System.Drawing.RectangleF 8,145,148,34),$format)
            $g.DrawString("Desktop 0.3.5",$sub,$soft,(New-Object System.Drawing.RectangleF 8,181,148,22),$format)
            $g.DrawString("Fluxo odontológico`nconectado ao seu Windows",$sub,$soft,(New-Object System.Drawing.RectangleF 12,232,140,46),$format)
            $bmp.Save("src-tauri/windows/installer-sidebar.bmp",[System.Drawing.Imaging.ImageFormat]::Bmp)
            $format.Dispose(); $soft.Dispose(); $white.Dispose(); $sub.Dispose(); $title.Dispose(); $brush.Dispose(); $g.Dispose(); $bmp.Dispose()
          }

          function Save-Header {
            $bmp = New-Object System.Drawing.Bitmap 150,57
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear($surface)
            $blue = New-Object System.Drawing.SolidBrush($brand)
            $g.FillRectangle($blue,0,0,6,57)
            $g.DrawImage($logo,14,8,41,41)
            $title = New-Object System.Drawing.Font("Segoe UI",14,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
            $sub = New-Object System.Drawing.Font("Segoe UI",8,[System.Drawing.FontStyle]::Regular,[System.Drawing.GraphicsUnit]::Pixel)
            $inkBrush = New-Object System.Drawing.SolidBrush($ink)
            $muted = New-Object System.Drawing.SolidBrush([System.Drawing.ColorTranslator]::FromHtml("#66809F"))
            $g.DrawString("DentalFlow",$title,$inkBrush,62,10)
            $g.DrawString("Instalação segura no Windows",$sub,$muted,62,31)
            $bmp.Save("src-tauri/windows/installer-header.bmp",[System.Drawing.Imaging.ImageFormat]::Bmp)
            $muted.Dispose(); $inkBrush.Dispose(); $sub.Dispose(); $title.Dispose(); $blue.Dispose(); $g.Dispose(); $bmp.Dispose()
          }

          Save-Sidebar
          Save-Header
          $logo.Dispose()

      - name: Prepare trusted Windows code signing
        id: codesign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host "Trusted code-signing secrets are not configured; build will remain unsigned."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          $base64 = ($env:WINDOWS_CERTIFICATE -replace '-----BEGIN [^-]+-----','' -replace '-----END [^-]+-----','' -replace '\s','')
          [IO.File]::WriteAllBytes("certificate/dentalflow-code-signing.pfx", [Convert]::FromBase64String($base64))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath "certificate/dentalflow-code-signing.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) { throw "Windows code-signing certificate could not be imported." }

          $platformConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "src-tauri/tauri.windows.conf.json" -Value $platformConfig -Encoding UTF8
          "ready=true" >> $env:GITHUB_OUTPUT
          Write-Host "Trusted signing enabled for publisher certificate $($cert.Subject)."

      - name: Build DentalFlow Desktop
        run: bun run desktop:build

      - name: Verify embedded frontend
        shell: pwsh
        run: |
          if (!(Test-Path "dist/client/index.html")) {
            throw "Desktop SPA shell was not generated at dist/client/index.html"
          }

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "DentalFlow Windows executable was not generated" }
          Write-Host "Executable: $($exe.FullName)"

      - name: Verify Authenticode signature
        if: steps.codesign.outputs.ready == 'true'
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "src-tauri/target/release" -Filter "*.exe" -File
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          )
          if ($files.Count -lt 2) { throw "Expected application and NSIS installer for signature verification." }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) | $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($file.FullName)" }
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
