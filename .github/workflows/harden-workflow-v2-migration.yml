name: Harden workflow v2 migration

on:
  push:
    branches: [feature/workflow-templates-v2]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-templates-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Harden migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260904203000_workflow_templates_v2.sql')
          s = p.read_text()
          if 'IF v_target IS NULL THEN' not in s:
              raise SystemExit('target record check not found')
          s = s.replace('IF v_target IS NULL THEN', 'IF NOT FOUND THEN', 1)
          needle = "-- Keep generated schema cache responsive after the migration.\nNOTIFY pgrst, 'reload schema';"
          if needle not in s:
              raise SystemExit('schema reload marker not found')
          extra = (
              '-- Workflow v2 is the default operating model after this migration.\n'
              'UPDATE public.workflow_settings\n'
              '   SET phases_enabled = true,\n'
              '       stages_enabled = true,\n'
              '       progress_bar_enabled = true,\n'
              '       updated_at = now()\n'
              ' WHERE id = true;\n\n'
              "-- Keep generated schema cache responsive after the migration.\n"
              "NOTIFY pgrst, 'reload schema';"
          )
          p.write_text(s.replace(needle, extra, 1))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Commit hardening and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/harden-workflow-v2-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260904203000_workflow_templates_v2.sql .github/workflows/harden-workflow-v2-migration.yml
          git commit -m "fix: harden workflow migration mapping" || exit 0
          git push origin HEAD:feature/workflow-templates-v2
