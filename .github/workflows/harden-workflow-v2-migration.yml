name: Harden workflow v2 migration

on:
  push:
    branches: [feature/workflow-templates-v2]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/workflow-templates-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Harden migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260904203000_workflow_templates_v2.sql')
          s = p.read_text()
          old = """      SELECT id, phase_id INTO v_target
            FROM public.stages
           WHERE flow_key = _flow_key AND workflow_version = v_new_version
             AND stage_key = v_current_key
           ORDER BY position LIMIT 1;
          IF v_target IS NULL THEN
            SELECT id, phase_id INTO v_target
              FROM public.stages
             WHERE flow_key = _flow_key AND workflow_version = v_new_version
             ORDER BY abs(position - COALESCE(v_current_pos,10)), position
             LIMIT 1;
          END IF;"""
          new = old.replace('IF v_target IS NULL THEN', 'IF NOT FOUND THEN')
          if old not in s:
              raise SystemExit('save template mapping block not found')
          s = s.replace(old, new, 1)
          needle = "-- Keep generated schema cache responsive after the migration.\nNOTIFY pgrst, 'reload schema';"
          lines = [
              '-- Workflow v2 is the default operating model after this migration.',
              'UPDATE public.workflow_settings',
              '   SET phases_enabled = true,',
              '       stages_enabled = true,',
              '       progress_bar_enabled = true,',
              '       updated_at = now()',
              ' WHERE id = true;',
              '',
              "-- Keep generated schema cache responsive after the migration.",
              "NOTIFY pgrst, 'reload schema';",
          ]
          if needle not in s:
              raise SystemExit('schema reload marker not found')
          p.write_text(s.replace(needle, '\n'.join(lines), 1))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Commit hardening and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/harden-workflow-v2-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260904203000_workflow_templates_v2.sql .github/workflows/harden-workflow-v2-migration.yml
          git commit -m "fix: harden workflow migration mapping" || exit 0
          git push origin HEAD:feature/workflow-templates-v2
