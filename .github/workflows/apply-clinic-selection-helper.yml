name: Wire tested tooth selection helper

on:
  push:
    branches:
      - feature/clinic-dynamic-dashboard-shell

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clinic-dynamic-dashboard-shell
          fetch-depth: 0

      - name: Wire helper into NewCaseDialog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/NewCaseDialog.tsx')
          source = path.read_text(encoding='utf-8')

          old_import = 'import { applyToothModifierSelection } from "@/lib/tooth-selection";'
          new_import = 'import { applyPlainWorkToothSelection, applyToothModifierSelection } from "@/lib/tooth-selection";'
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit('Expected tooth-selection import not found.')
              source = source.replace(old_import, new_import, 1)

          old_block = '''    const staleTemporary = teeth.filter((item) => item !== tooth && !toothHasConfig(item));
    const staleSet = new Set(staleTemporary);
    const next = teeth.filter((item) => !staleSet.has(item));
    if (!next.includes(tooth)) next.push(tooth);
    setTeeth(sortTeeth(next));'''
          new_block = '''    const next = applyPlainWorkToothSelection(teeth, tooth, assignedTeeth);
    setTeeth(sortTeeth(next));'''

          if new_block not in source:
              if old_block not in source:
                  raise SystemExit('Expected plain-click selection block not found.')
              source = source.replace(old_block, new_block, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit focused patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/NewCaseDialog.tsx
          git commit -m 'refactor: use tested plain tooth selection helper'
          git push origin HEAD:feature/clinic-dynamic-dashboard-shell
