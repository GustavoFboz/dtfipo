name: Apply scoped case stage picker patch

on:
  push:
    branches:
      - "feature/clinic-agenda-login-workflow-ux"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clinic-agenda-login-workflow-ux
          fetch-depth: 0

      - name: Apply guarded source patch
        run: node scripts/apply-case-stage-picker-patch.mjs

      - name: Remove one-off patch machinery
        run: git rm scripts/apply-case-stage-picker-patch.mjs .github/workflows/apply-case-stage-picker-patch.yml

      - name: Commit scoped picker fix
        run: |
          git config user.name "DentalFlow CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/CasesTable.tsx
          git commit -m "fix: scope case stage picker to current workflow"
          git push origin HEAD:feature/clinic-agenda-login-workflow-ux
