name: DentalFlow iOS 0.1.0 - iPhone IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - "mobile/ios-*"
    paths:
      - ".github/workflows/mobile-ios-iphone.yml"
      - "mobile/ios/**"
      - "src/routes/auth.tsx"
      - "src/mobile-app.css"
      - "src/components/MobileNativeBridge.tsx"
      - "src/lib/mobile/**"
  pull_request:
    branches:
      - saas/stage-03-asaas-checkout
    paths:
      - ".github/workflows/mobile-ios-iphone.yml"
      - "mobile/ios/**"

permissions:
  contents: read

jobs:
  build-iphone-unsigned:
    name: Build iPhone device IPA for Windows sideloading
    runs-on: macos-15
    timeout-minutes: 55
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies from existing lockfile
        run: bun install --frozen-lockfile

      - name: Verify login error handling
        run: bunx vitest run src/lib/mobile/auth-errors.test.ts

      - name: Add matching iOS Capacitor native toolchain (runner only)
        shell: bash
        run: |
          set -euo pipefail
          CAP_VERSION="$(node -p "require('./node_modules/@capacitor/core/package.json').version")"
          bun add --dev "@capacitor/ios@$CAP_VERSION"

      - name: Build mobile web frontend
        run: bun run build:mobile

      - name: Generate iPhone native project
        run: |
          bunx cap add ios
          bunx cap sync ios

      - name: Apply DentalFlow icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -s public/icon-512.png
          mkdir -p "$ICON_SET"
          sips -z 1024 1024 public/icon-512.png --out "$ICON_SET/AppIcon-512@2x.png" >/dev/null
          cat > "$ICON_SET/Contents.json" <<'JSON'
          {
            "images": [{"filename": "AppIcon-512@2x.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}],
            "info": {"author": "xcode", "version": 1}
          }
          JSON

      - name: Compile for physical iPhone arm64 (WITHOUT CODE SIGNING)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DentalFlowDeviceBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION=1 \
            build

      - name: Package unsigned IPA for personal signing on Windows
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DentalFlowDeviceBuild/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"
          lipo -archs "$APP/$EXECUTABLE" | grep -qw arm64

          mkdir -p "$RUNNER_TEMP/DentalFlowIPAPackage/Payload"
          ditto "$APP" "$RUNNER_TEMP/DentalFlowIPAPackage/Payload/App.app"
          (
            cd "$RUNNER_TEMP/DentalFlowIPAPackage"
            zip -qry "$GITHUB_WORKSPACE/DentalFlow_iOS_0.1.0_iPhone_UNSIGNED.ipa" Payload
          )
          test -s DentalFlow_iOS_0.1.0_iPhone_UNSIGNED.ipa
          unzip -l DentalFlow_iOS_0.1.0_iPhone_UNSIGNED.ipa | grep -q 'Payload/App.app/Info.plist'
          shasum -a 256 DentalFlow_iOS_0.1.0_iPhone_UNSIGNED.ipa > DentalFlow_iOS_0.1.0_iPhone_SHA256.txt

          cat > LEIA-ME-WINDOWS.txt <<'TEXT'
          DentalFlow iOS 0.1.0 - pacote iPhone ARM64 NÃO ASSINADO

          Este IPA só pode ser instalado em iPhone físico APÓS assinatura
          Apple feita pelo programa Sideloadly no Windows (https://sideloadly.io/).
          NÃO use o ZIP do simulador em iPhone real.

          1. No Windows, instale Sideloadly e os drivers Apple necessários.
          2. Conecte o iPhone por cabo, desbloqueie e toque em Confiar.
          3. Selecione este IPA no Sideloadly; escolha o iPhone e entre com
             SEU ID Apple diretamente no Sideloadly (não no DentalFlow).
          4. Deixe Apple ID Sideload ativado e clique em Start.
          5. Se exigido, habilite Modo de Desenvolvedor no iPhone e
             confie no aplicativo em Ajustes.
          6. Abra DentalFlow. Login real depende do Cloud Login acessível.

          A assinatura com Apple ID gratuito dura 7 dias e precisa renovação.
          NÃO envie senha Apple ao GitHub nem ao desenvolvedor DentalFlow.
          O acesso ao backend e a segurança de dados clinicos não foram
          homologados. Uso para testes, não para operação clínica real.
          TEXT

      - name: Upload IPA and SHA-256 for Windows tester
        uses: actions/upload-artifact@v4
        with:
          name: DentalFlow-iOS-0.1.0-iPhone-unsigned-IPA
          path: |
            DentalFlow_iOS_0.1.0_iPhone_UNSIGNED.ipa
            DentalFlow_iOS_0.1.0_iPhone_SHA256.txt
            LEIA-ME-WINDOWS.txt
          if-no-files-found: error
          retention-days: 14
