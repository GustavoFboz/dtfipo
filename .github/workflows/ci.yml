name: Dental Flow CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "stabilization/**"
      - "feature/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tooth selection integration
        if: github.ref == 'refs/heads/feature/tooth-modifier-selection'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          selector_path = Path("src/components/TeethSelector.tsx")
          selector = selector_path.read_text()
          if 'import { applyToothModifierSelection } from "@/lib/tooth-selection";' not in selector:
              selector = selector.replace(
                  'import svgRawSource from "@/assets/arcada.svg?raw";\n',
                  'import svgRawSource from "@/assets/arcada.svg?raw";\nimport { applyToothModifierSelection } from "@/lib/tooth-selection";\n',
                  1,
              )
          old_arch = '''const ARCH_UPPER = [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28];
          const ARCH_LOWER = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];
          function archOf(n: number): number[] {
            return n < 30 ? ARCH_UPPER : ARCH_LOWER;
          }
          '''
          if old_arch in selector:
              selector = selector.replace(old_arch, "", 1)

          old_default = '''    // File-manager semantics:
              // click = single selection; Ctrl/Cmd = toggle one; Shift = additive range.
              const current = new Set(valueRef.current);
              const anchor = anchorRef.current;
              if (event.shiftKey && anchor !== null && archOf(anchor) === archOf(n)) {
                const arch = archOf(n);
                const a = arch.indexOf(anchor);
                const b = arch.indexOf(n);
                if (a !== -1 && b !== -1) {
                  const [lo, hi] = a < b ? [a, b] : [b, a];
                  for (let i = lo; i <= hi; i += 1) current.add(arch[i]);
                  onChangeRef.current(Array.from(current));
                  return;
                }
              }
              if (event.ctrlKey || event.metaKey) {
                if (current.has(n)) current.delete(n);
                else current.add(n);
                anchorRef.current = n;
                onChangeRef.current(Array.from(current));
                return;
              }
              anchorRef.current = n;
              onChangeRef.current([n]);
          '''
          new_default = '''    // File-manager semantics. Ctrl/Cmd toggles one tooth and resets the
              // range anchor. Shift toggles the contiguous interval from that anchor:
              // add when any tooth is missing, remove when the whole interval is selected.
              const modifierSelection = applyToothModifierSelection(
                valueRef.current,
                n,
                anchorRef.current,
                mods,
              );
              if (modifierSelection) {
                anchorRef.current = modifierSelection.anchor;
                onChangeRef.current(modifierSelection.next);
                return;
              }

              anchorRef.current = n;
              onChangeRef.current([n]);
          '''
          if old_default not in selector and new_default not in selector:
              raise SystemExit("TeethSelector selection block not found")
          selector = selector.replace(old_default, new_default, 1)
          selector_path.write_text(selector)

          dialog_path = Path("src/components/NewCaseDialog.tsx")
          dialog = dialog_path.read_text()
          if 'import { applyToothModifierSelection } from "@/lib/tooth-selection";' not in dialog:
              dialog = dialog.replace(
                  'import { sortTeeth } from "@/lib/teeth";\n',
                  'import { sortTeeth } from "@/lib/teeth";\nimport { applyToothModifierSelection } from "@/lib/tooth-selection";\n',
                  1,
              )
          old_local_arch = '''  const ARCH_UPPER_L = [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28];
            const ARCH_LOWER_L = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];

          '''
          if old_local_arch in dialog:
              dialog = dialog.replace(old_local_arch, "", 1)

          old_handler_head = '''  const handleWorkToothClick = (tooth: number, mods: { ctrl: boolean; shift: boolean }) => {
              const current = new Set(teeth);
              const anchor = selectionAnchorRef.current ?? focusedTooth ?? lastConfiguredTooth;
              const rangeFor = (from: number, to: number) => {
                const arch = from < 30 ? ARCH_UPPER_L : ARCH_LOWER_L;
                if (!arch.includes(from) || !arch.includes(to)) return [to];
                const a = arch.indexOf(from);
                const b = arch.indexOf(to);
                const [lo, hi] = a < b ? [a, b] : [b, a];
                return arch.slice(lo, hi + 1);
              };

          '''
          new_handler_head = '''  const handleWorkToothClick = (tooth: number, mods: { ctrl: boolean; shift: boolean }) => {
              const current = new Set(teeth);
              const anchor = selectionAnchorRef.current ?? focusedTooth ?? lastConfiguredTooth;

          '''
          if old_handler_head not in dialog and new_handler_head not in dialog:
              raise SystemExit("NewCaseDialog handler head not found")
          dialog = dialog.replace(old_handler_head, new_handler_head, 1)

          old_modifiers = '''    // Ctrl/Cmd behaves like a file manager: toggle exactly one tooth without
              // disturbing the rest of the selection. Removing a tooth also clears its
              // clinical configuration to avoid invisible/stale work data.
              if (mods.ctrl && !mods.shift) {
                selectionAnchorRef.current = tooth;
                if (current.has(tooth)) {
                  current.delete(tooth);
                  clearToothConfig(tooth);
                  setTeeth(sortTeeth(Array.from(current)));
                  setConfigGroup((group) => group.filter((item) => item !== tooth));
                  setJustAddedTeeth((items) => items.filter((item) => item !== tooth));
                  if (focusedTooth === tooth) setFocusedTooth(null);
                  return;
                }
                current.add(tooth);
                setTeeth(sortTeeth(Array.from(current)));
                setFocusedTooth(tooth);
                setConfigGroup([tooth]);
                setJustAddedTeeth([tooth]);
                return;
              }

              // Shift adds the whole FDI interval to the existing selection using the
              // last non-Shift anchor. Independent earlier selections are preserved.
              if (mods.shift && anchor != null) {
                const range = rangeFor(anchor, tooth);
                range.forEach((item) => current.add(item));
                setTeeth(sortTeeth(Array.from(current)));
                setConfigGroup(range);
                setFocusedTooth(tooth);
                const newlyAdded = range.filter((item) => !teeth.includes(item));
                setJustAddedTeeth(newlyAdded);
                return;
              }

          '''
          new_modifiers = '''    const modifierSelection = applyToothModifierSelection(teeth, tooth, anchor, mods);
              if (modifierSelection) {
                // Ctrl/Cmd always makes the clicked tooth the next Shift anchor, even
                // after an earlier range selection. Shift deliberately keeps that anchor.
                selectionAnchorRef.current = modifierSelection.anchor;
                modifierSelection.removed.forEach(clearToothConfig);
                setTeeth(sortTeeth(modifierSelection.next));

                if (modifierSelection.kind === "toggle-add") {
                  setFocusedTooth(tooth);
                  setConfigGroup([tooth]);
                  setJustAddedTeeth([tooth]);
                } else if (modifierSelection.kind === "toggle-remove") {
                  setConfigGroup((group) => group.filter((item) => item !== tooth));
                  setJustAddedTeeth((items) => items.filter((item) => item !== tooth));
                  if (focusedTooth === tooth) setFocusedTooth(null);
                } else if (modifierSelection.kind === "range-add") {
                  setConfigGroup(modifierSelection.affected);
                  setFocusedTooth(tooth);
                  setJustAddedTeeth(modifierSelection.added);
                } else {
                  const removed = new Set(modifierSelection.removed);
                  setConfigGroup((group) => group.filter((item) => !removed.has(item)));
                  setJustAddedTeeth((items) => items.filter((item) => !removed.has(item)));
                  if (focusedTooth != null && removed.has(focusedTooth)) setFocusedTooth(null);
                }
                return;
              }

          '''
          if old_modifiers not in dialog and new_modifiers not in dialog:
              raise SystemExit("NewCaseDialog modifier block not found")
          dialog = dialog.replace(old_modifiers, new_modifiers, 1)
          dialog_path.write_text(dialog)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Selection regression tests
        if: github.ref == 'refs/heads/feature/tooth-modifier-selection'
        run: bunx vitest run src/lib/tooth-selection.test.ts

      - name: Production build
        run: bun run build

      - name: Commit integration and restore CI
        if: github.ref == 'refs/heads/feature/tooth-modifier-selection'
        shell: bash
        run: |
          rm -f .github/workflows/apply-tooth-modifier-selection.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TeethSelector.tsx src/components/NewCaseDialog.tsx src/lib/tooth-selection.ts src/lib/tooth-selection.test.ts .github/workflows/ci.yml
          git add -u .github/workflows/apply-tooth-modifier-selection.yml || true
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "feat: support ctrl and shift tooth range toggling"
            git push origin HEAD:feature/tooth-modifier-selection
          fi
