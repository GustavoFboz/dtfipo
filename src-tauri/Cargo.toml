[package]
name = "dentalflow-desktop"
version = "0.3.0"
description = "DentalFlow Desktop for Windows"
authors = ["DentalFlow"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dentalflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
